name: Extract EXITA Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project files
        run: |
          unzip -q EXITA_UTARA_UNITY_FOUNDATION.zip -d extracted
          cp -a extracted/EXITA_UTARA_UNITY_FOUNDATION/Assets .
          cp -a extracted/EXITA_UTARA_UNITY_FOUNDATION/ProjectSettings .
          cp -a extracted/EXITA_UTARA_UNITY_FOUNDATION/README_MULA_DI_SINI.txt .

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets ProjectSettings README_MULA_DI_SINI.txt
          git commit -m "Add EXITA project foundation"
          git push
